name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # lts/* always resolves to whatever Node's current LTS release is, rather than a
          # version number pinned here that would silently go stale.
          node-version: lts/*

      - run: npm ci

      # Unit/integration/security tests, syntax checks, and Mozilla's official add-on
      # linter are all part of the single release gate.
      - run: npm run verify
